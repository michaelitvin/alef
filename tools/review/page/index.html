<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review</title>
<link rel="stylesheet" href="page.css">
<link rel="modulepreload" href="render.ts">
<link rel="modulepreload" href="flow.ts">
<link rel="modulepreload" href="player.ts">
<link rel="modulepreload" href="save.ts">
<script>window.__state = fetch('api/state', { cache: 'no-cache' })</script>
<script type="module" src="main.ts"></script>
</head>
<body>
<header class="top">
  <h1><span id="title">Review</span><small>One item at a time: OK, or Reject with a reason, and the next item plays. Tap a picture to see its word.</small></h1>
  <div class="tools" role="group" aria-label="Which items to show">
    <button class="tg" data-view="focus" aria-pressed="false">Needs you</button>
    <button class="tg" data-view="open" aria-pressed="false">Open</button>
    <button class="tg" data-view="sample" aria-pressed="false">Sample</button>
    <button class="tg" data-view="all" aria-pressed="false">All</button>
    <button class="tg" id="v-refresh">Refresh</button>
  </div>
</header>
<div class="glance" id="glance"></div>
<main id="main"><p class="empty">Loading…</p></main>
<div id="bar">
  <button class="now" id="now" disabled aria-label="Show the current item"></button>
  <div id="note"><input id="noteText" aria-label="Note" maxlength="1000"><button class="btn bad" id="noteGo">Reject</button><button class="btn ghost" id="noteNo">Cancel</button></div>
  <div class="row aux">
    <button class="btn ghost" id="b-replay">Replay</button>
    <button class="btn ghost" id="b-later">Later</button>
  </div>
  <div class="row decide">
    <button class="btn bad" id="b-rej">Reject</button>
    <button class="btn ok" id="b-ok">OK</button>
  </div>
</div>
</body>
</html>
